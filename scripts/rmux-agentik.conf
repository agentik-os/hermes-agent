# Agentik OS RMUX policy. RMUX is runtime; `agk` is Control Mode.
set -g prefix C-b
bind C-b send-prefix
set -g mouse on
set -g history-limit 200000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-keys vi
set -g status on
set -g status-position top
set -g status-left-length 100
set -g status-right-length 120
set -g status-left '#[fg=cyan,bold] AGK #[default] #S · #I:#W '
set -g status-right '#[fg=cyan]TERMINAL MODE #[fg=colour240]· #[fg=green]Ctrl-b d detach #[default]'

# Detach never kills persistent work.
bind d detach-client
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind [ copy-mode
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
